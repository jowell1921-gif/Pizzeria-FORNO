# PostgreSQL local para desarrollo y pruebas. No se usa en producción (allí se usa Supabase).
services:
  postgres:
    image: postgres:17-alpine
    container_name: forno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forno
      POSTGRES_PASSWORD: forno_dev_password
      POSTGRES_DB: forno_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forno_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forno -d forno_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forno_pgdata:
